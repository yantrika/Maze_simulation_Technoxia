          translation IS casterPosition  # <--- matches anchor
          children [
            DEF caster Shape {
              appearance PBRAppearance {
                baseColor 1 0 0
                roughness 1
                metalness 0
              }
              geometry Sphere {
                radius IS casterRadius   # <--- also linked
