            baseColor 0 0 0
            roughness 1
            metalness 0
          }
          geometry Box {
            size 0.05 0.01 0.008
          }
        }
      ]
      name "solid(5)"
      boundingObject USE eeye
      physics IS sensorsCollide
    }
    DEF eye3 Solid {
      translation -0.126 0.06 0.06
